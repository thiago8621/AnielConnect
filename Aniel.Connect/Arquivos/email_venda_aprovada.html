<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">

    <title>Ativação</title>

    <style>

        html {
            font-family: sans-serif;
            line-height: 1.15;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            -ms-overflow-style: scrollbar;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            text-align: left;
            background-color: #fff;
        }

        .container-fluid {
            text-align: center;
            width: 100%;
            padding-right: 15px;
            /*padding-left: 15px;*/
            margin-right: auto;
            margin-left: auto;
        }

        .jumbotron {
            padding: 0;
            margin-bottom: 2rem;
            border-radius: .3rem;
        }

        img {
            vertical-align: middle;
            border-style: none;
        }

        p {
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .lead {
            font-size: 1.25rem;
            font-weight: 300;
        }

        .mb-0 {
            margin-bottom: 0;
        }

        strong {
            font-weight: bolder;
        }

        .text-muted {
            color: #6c757d;
        }

        .img-fluid {
            max-width: 100%;
        }

        .barra {
            background-color: dodgerblue;
            height: 60px;
            width: 50%;
            margin-bottom: 20px;
            margin-top: 50px;
        }

        .traco {
            background-color: lightgray;
            height: 5px;
            width: 5%;
            margin-bottom: 20px;
            margin-top: 30px;
        }

        .rodape {
            color: #868686;
            font-size: 12px;
            font-weight: 600;
        }
    </style>

</head>

<body>

    <div class="container-fluid">
        <div class="jumbotron text-center" style="background-color: #fff">

            <br />
            <img src="{{URL_LOGO}}" class="img-fluid" alt="Logo.png" title="Logo" style="max-width: 30%;" />

            <br /><br />

            
            <div style="text-align: center; margin-bottom: 15px;">
                <span style="color:#FE5000; font-weight:bold; font-size:17px;">
                    resumo da contratação
                </span>
            </div>

            <div class="container-tabela" style="text-align: center; font-size:15px; color:#4D4D4D; line-height:1.8;">
                {{TABELA}}
            </div>



            <!--<center>
        <div class="traco">

        </div>
    </center>

    <center>
        <div class="barra">

        </div>
    </center>-->
            <br /><br />

            <p class="lead">
                <font face="Arial" size="4">
                    <b>
                        Em caso de qualquer d&uacute;vida, entre em contato com seu <br />
                        provedor pelos canais de comunica&ccedil;&atilde;o <span><strong>{{NUMERO_TELENONE_ISP}};</strong></span> <br />
                        ou pelo E-mail <span><strong>{{EMAIL}};</strong></span>
                    </b>
                </font>
            </p>


        </div>
    </div>
</body>

</html>
